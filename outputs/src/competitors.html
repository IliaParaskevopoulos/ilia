<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PAJ GPS · Competitors</title>
<link rel="stylesheet" href="brand.css">
<script src="data.js"></script>
<style>
  .top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 5mm; }
  .cols4 { grid-template-columns: 1.15fr 1fr 1fr 1fr; margin-bottom: 5mm; }
  .cols3 { grid-template-columns: repeat(3, 1fr); }
  dl.kv dt { font-size: 7.5pt; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-top: 1.4mm; }
  dl.kv dt:first-child { margin-top: 0; }
  .threat { text-align: right; }
  .threat .pill { font-size: 9pt; padding: 1mm 3mm; }
  .track { background: var(--black); color: #fff; padding: 3mm 4mm; border-left: 1.2mm solid var(--orange); font-size: 11pt; font-weight: 600; }
  .track .kicker { color: var(--orange); display: block; margin-bottom: 1mm; }
  .sum { display: grid; grid-template-columns: 1fr 2.3fr; gap: 8mm; align-items: start; }
  .big ul.dash li { font-size: 11pt; margin-bottom: 2.5mm; }
  /* Battle card */
  .bc { display: grid; grid-template-columns: 1fr 1.35fr 1fr; gap: 5mm; align-items: start; }
  .bc .side { background: var(--black); color: #fff; padding: 4mm; }
  .bc .side h2 { color: var(--orange); }
  .bc .side ul.dash li { margin-bottom: 1.8mm; }
  .yes { color: var(--ink); font-weight: 700; } .no { color: var(--ink-3); }
  .h2h { display: grid; grid-template-columns: 30mm 1fr 8mm 8mm; align-items: center; column-gap: 3mm; row-gap: 1.6mm; font-size: 9pt; }
  .h2h .track2 { position: relative; height: 4mm; }
  .h2h .track2::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 0.3mm; background: var(--line); }
  .h2h .seg { position: absolute; top: 50%; height: 0.6mm; margin-top: -0.3mm; background: var(--ink-3); }
  .h2h .dot { position: absolute; top: 50%; width: 3.2mm; height: 3.2mm; margin: -1.6mm 0 0 -1.6mm; border-radius: 50%; border: 0.5mm solid #fff; }
  .h2h .dot.them { background: var(--ink-2); } .h2h .dot.us { background: var(--orange); }
  .h2h .n { text-align: right; font-variant-numeric: tabular-nums; } .h2h .n.us { font-weight: 700; }
  .legend { font-size: 7.5pt; color: var(--ink-3); display: flex; gap: 4mm; margin-bottom: 2mm; }
  .legend i { display: inline-block; width: 2.4mm; height: 2.4mm; border-radius: 50%; margin-right: 1mm; vertical-align: -0.3mm; }
  table.t td.c, table.t th.c { text-align: center; }
  table.t td.u, table.t th.u { background: var(--orange-tint); font-weight: 700; }
</style></head><body>
<div id="doc"></div>
<script>
const C = [
 { name: 'Tractive', seg: 'Pets', threat: 'High',
   pos: 'The #1 GPS tracker for dogs and cats.',
   hq: 'Pasching, Austria · since 2012', offer: 'GPS DOG / CAT trackers, health & activity', price: '~€50 device + ~€5–13/mo (verify)',
   str: ['Category leader, strong brand', 'Health, activity, sleep tracking', 'Polished app, big community', 'Wide retail presence'],
   weak: ['Pets only', 'Mandatory, pricier subscription', 'Battery a few days'],
   win: ['Lower price', 'One app: pet + family + car', 'German company, support'],
   lose: ['Brand awareness', 'Health features', 'Retail shelf space'],
   track: 'Same live tracking. Lower price. One app for the whole household.' },
 { name: 'Weenect', seg: 'Pets · Seniors', threat: 'Medium',
   pos: 'GPS trackers for pets and loved ones.',
   hq: 'Paris, France', offer: 'Dog, cat, kids, senior trackers', price: 'Device + ~€5–10/mo (verify)',
   str: ['Multi-segment consumer range', 'Design, cat-specific device', 'Strong in France'],
   weak: ['No vehicle / fleet line', 'Smaller DACH presence'],
   win: ['Vehicle and equipment range', 'DACH presence', 'Price'],
   lose: ['Design', 'Cat-specific form factor'],
   track: 'Everything Weenect tracks, plus your car, van and trailer.' },
 { name: 'Apple AirTag', sub: 'and Samsung SmartTag', seg: 'All segments', threat: 'High',
   pos: 'Lose your knack for losing things.',
   hq: 'Cupertino, USA', offer: 'Bluetooth item finder, Find My network', price: '~€35, no subscription',
   str: ['Price anchor, no subscription', 'Huge crowd network', '1-year coin battery', 'Brand trust'],
   weak: ['Not real-time; needs iPhones nearby', 'Anti-stalking alerts warn thieves', 'No geofence, no SOS', 'Apple: not for pets or people'],
   win: ['Live 4G anywhere', 'Geofence, alarms, SOS', 'Theft recovery'],
   lose: ['Price', 'Zero setup'],
   track: 'AirTag tells you where it was. PAJ tells you where it is.' },
 { name: 'Invoxia', seg: 'Pets · Vehicles', threat: 'Medium',
   pos: 'Discreet trackers, months of battery.',
   hq: 'Issy-les-Moulineaux, France', offer: 'Pet, bike and car trackers (LTE-M / LoRa)', price: 'Device incl. 1–3 yrs, then sub (verify)',
   str: ['Long battery', 'Small, discreet', 'Design'],
   weak: ['Interval updates, less live', 'Fewer alarms, no SOS', 'Thin fleet tooling'],
   win: ['True live tracking', 'SOS and alarm range', 'Fleet portal'],
   lose: ['Battery life', 'Size'],
   track: 'When it matters, minutes count. PAJ updates live.' },
 { name: 'Hausnotruf', sub: 'DRK · Johanniter · Malteser', seg: 'Seniors', threat: 'Medium',
   pos: 'Help at the press of a button, 24/7.',
   hq: 'Germany · welfare organisations', offer: 'Home emergency button + call centre; mobile variants', price: 'Base ~€25/mo, reimbursable with care grade (verify)',
   str: ['24/7 human response', 'Trust, institutions', 'Insurer reimbursement'],
   weak: ['Base system stops at the door', 'Mobile option costs more', 'Dated tech'],
   win: ['Works outside the home', 'Location to family, live', 'Lower mobile cost'],
   lose: ['Human call centre', 'Reimbursement', 'Institutional trust'],
   track: 'Hausnotruf at home. PAJ everywhere else.' },
 { name: 'Webfleet', sub: 'Bridgestone', seg: 'Fleet', threat: 'Medium',
   pos: 'Europe’s leading fleet management solution.',
   hq: 'Amsterdam, NL', offer: 'Telematics, driver behaviour, tachograph, integrations', price: 'Per vehicle, multi-year contract (verify)',
   str: ['Deep fleet features', 'Integrations, ecosystem', 'Installer network, scale'],
   weak: ['Price', 'Long contracts', 'Overkill for small fleets'],
   win: ['Price per vehicle', 'No lock-in', 'DIY install, equipment'],
   lose: ['Feature depth', 'Integrations', 'Enterprise deals'],
   track: 'What a 10-van business needs, at a fraction of the price.' },
 { name: 'Samsara', seg: 'Fleet (enterprise)', threat: 'Low',
   pos: 'The Connected Operations Cloud.',
   hq: 'San Francisco, USA · NYSE: IOT', offer: 'Telematics, AI dashcams, operations platform', price: 'Enterprise, multi-year (verify)',
   str: ['AI video safety', 'Platform, integrations', 'Enterprise sales'],
   weak: ['Enterprise pricing', 'US-centric', 'Complex for SMB'],
   win: ['SMB price, simplicity', 'EU, GDPR', 'Self-serve'],
   lose: ['Anything enterprise'],
   track: 'Not our fight. Walk away above ~200 vehicles.' },
 { name: 'Vimcar', seg: 'Fleet (DACH SMB)', threat: 'High',
   pos: 'Fleet management and tax-proof logbook for SMBs.',
   hq: 'Berlin, Germany', offer: 'OBD dongle, digital logbook, fleet software', price: 'Per vehicle / month (verify)',
   str: ['Tax-office-proof logbook', 'DACH SMB focus', 'Accounting fit'],
   weak: ['Vehicles only', 'No battery / equipment trackers', 'No consumer range'],
   win: ['Trailers, machines, equipment', 'Theft use case', 'Price'],
   lose: ['Tax logbook depth', 'Accounting integrations'],
   track: 'Track everything you own, not just the cars.' },
];
const total = C.length + 2;
const bar = (n) => `<div class="bar"><div class="logo">PAJ <b>GPS</b></div><div class="doc">Competitive landscape · ${n} / ${total}</div></div>`;
const foot = `<div class="foot"><span>Positions directional; items marked (verify) unconfirmed</span><span>Internal · Q4 2026</span></div>`;
const li = (a) => `<ul class="dash">${a.map(x => `<li>${x}</li>`).join('')}</ul>`;
const pill = (t) => `<span class="pill ${t === 'High' ? 'hi' : t === 'Medium' ? 'dark' : ''}">${t}</span>`;
const h2h = (name) => {
  const t = SCORES[name], u = SCORES['PAJ'];
  const rows = Object.keys(VARS).filter(k => t[k] != null).map(k => {
    const a = Math.min(t[k], u[k]) * 10, b = Math.max(t[k], u[k]) * 10;
    return `<div>${VARS[k]}</div><div class="track2"><div class="seg" style="left:${a}%;width:${b - a}%"></div>
      <div class="dot them" style="left:${t[k] * 10}%"></div><div class="dot us" style="left:${u[k] * 10}%"></div></div>
      <div class="n us">${u[k]}</div><div class="n">${t[k]}</div>`;
  }).join('');
  return `<div class="legend"><span><i style="background:var(--orange)"></i>PAJ</span><span><i style="background:var(--ink-2)"></i>${name}</span><span>· directional (verify)</span></div><div class="h2h">${rows}</div>`;
};
let h = '';

// Executive summary
h += `<section class="page">${bar(1)}<div class="body">
  <div class="top"><div><div class="kicker">Executive summary</div><h1>Eight rivals. One open lane.</h1></div></div>
  <div class="sum">
    <div class="big">${li([
      '<b>Specialists own each segment:</b> Tractive (pets), Hausnotruf (seniors), Webfleet / Vimcar (fleet).',
      '<b>AirTag sets the price anchor:</b> €35, no subscription, but not live.',
      '<b>PAJ is the only player across pets, people and vehicles</b> in one app.',
      '<b>Play:</b> live 4G at a fair price; win on breadth to grow devices per customer.'])}</div>
    <table class="t"><thead><tr><th>Competitor</th><th>Segment</th><th>Threat</th><th>We win on</th><th>We lose on</th></tr></thead><tbody>
    ${C.map(c => `<tr><td><b>${c.name}</b></td><td>${c.seg}</td><td>${pill(c.threat)}</td><td>${c.win[0]}</td><td>${c.lose[0]}</td></tr>`).join('')}
    </tbody></table>
  </div></div>${foot}</section>`;

// One page per competitor
C.forEach((c, i) => {
  h += `<section class="page">${bar(i + 2)}<div class="body">
  <div class="top"><div><div class="kicker">Competitor ${i + 1} / ${C.length} · ${c.seg}</div>
    <h1>${c.name}${c.sub ? ` <span class="muted" style="font-size:14pt;font-weight:600">${c.sub}</span>` : ''}</h1>
    <div class="quote">${c.pos}</div></div>
    <div class="threat"><div class="kicker" style="color:var(--ink-3)">Threat</div>${pill(c.threat)}</div></div>
  <div class="grid cols4">
    <div class="card accent"><h2>Snapshot</h2><dl class="kv"><dt>HQ</dt><dd>${c.hq}</dd><dt>Offer</dt><dd>${c.offer}</dd><dt>Pricing</dt><dd>${c.price}</dd></dl></div>
    <div class="card"><h2>Strengths</h2>${li(c.str)}</div>
    <div class="card"><h2>Weaknesses</h2>${li(c.weak)}</div>
    <div class="card"><h2>Where we lose</h2>${li(c.lose)}</div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 2fr;">
    <div class="card accent"><h2>Where we win</h2>${li(c.win)}</div>
    <div><div class="track"><span class="kicker">Talk track</span>${c.track}</div>
      <div class="card" style="margin-top:5mm"><h2>Head-to-head · 0–10</h2>${h2h(c.name)}</div></div>
  </div></div>${foot}</section>`;
});

// Battle card
const row = (k, a, b, c) => `<tr><td>${k}</td><td class="c u">${a}</td><td class="c">${b}</td><td class="c">${c}</td></tr>`;
h += `<section class="page">${bar(total)}<div class="body">
  <div class="top"><div><div class="kicker">Battle card · Pets</div><h1>PET Finder 4G <span class="muted" style="font-size:14pt;font-weight:600">vs Tractive · AirTag</span></h1>
    <div class="quote">Live 4G tracking for your dog, at a fair price, in one app for the whole family.</div></div></div>
  <div class="bc">
    <div class="side"><h2>Why we win</h2>${li(['<b>Live, anywhere.</b> 4G, not Bluetooth.', '<b>Fair price.</b> Below Tractive per month.', '<b>One app.</b> Dog, parents, car, van.', '<b>German.</b> GDPR, local support.'])}
      <h2 style="margin-top:4mm">Landmines to set</h2><ol class="rank" style="color:#fff">
      <li>"What if your dog runs where no iPhone is?"</li><li>"What will it cost you over 2 years?"</li><li>"Who else in your family needs tracking?"</li></ol></div>
    <div><h2>Quick facts</h2><table class="t"><thead><tr><th></th><th class="c u">PAJ PET</th><th class="c">Tractive</th><th class="c">AirTag</th></tr></thead><tbody>
      ${row('Live 4G tracking', '<span class="yes">Yes</span>', '<span class="yes">Yes</span>', '<span class="no">No</span>')}
      ${row('Monthly cost', '~€4–5', '~€5–13', '€0')}
      ${row('Device price', '~€40–50', '~€50', '~€35')}
      ${row('Battery', 'up to 5 days', '2–7 days', '~1 year')}
      ${row('Waterproof', '<span class="yes">Yes</span>', 'IPX7', 'IP67')}
      ${row('Geofence alert', '<span class="yes">Yes</span>', '<span class="yes">Yes</span>', '<span class="no">No</span>')}
      ${row('Health / activity', '<span class="no">Basic</span>', '<span class="yes">Yes</span>', '<span class="no">No</span>')}
      ${row('Pets + people + vehicles', '<span class="yes">Yes</span>', '<span class="no">Pets only</span>', '<span class="no">Items</span>')}
      </tbody></table><div class="verify" style="margin-top:1.5mm">Prices and specs from retailer / review data, 2025 (verify before external use).</div></div>
    <div><h2>Objections → answer</h2><table class="t"><tbody>
      <tr><td>"Tractive is the known brand"</td><td>Same live tracking, lower monthly cost.</td></tr>
      <tr><td>"I want health stats"</td><td>We focus on finding your dog. Fast.</td></tr>
      <tr><td>"AirTag is cheaper"</td><td>Until your dog is in a field with no phones.</td></tr>
      <tr><td>"Battery too short"</td><td>Up to 5 days + low-battery alert.</td></tr></tbody></table>
      <h2 style="margin-top:4mm">Don't</h2>${li(['Attack Tractive health features', 'Promise exact battery days', 'Sell to owners of dogs &lt; 4 kg'])}</div>
  </div></div>${foot}</section>`;
document.getElementById('doc').innerHTML = h;
</script>
</body></html>
